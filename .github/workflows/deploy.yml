name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: screen-share-459802
  REGION: asia-northeast1
  SERVICE: magi-price-tracker

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/398890937507/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@screen-share-459802.iam.gserviceaccount.com'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --source=. \
            --region=${{ env.REGION }} \
            --no-allow-unauthenticated \
            --memory=512Mi \
            --timeout=540s \
            --clear-base-image \
            --project=${{ env.PROJECT_ID }}

      - name: Setup Cloud Scheduler for price tracker (hourly America/New_York)
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          gcloud scheduler jobs describe magi-price-tracker-hourly \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} 2>/dev/null && \
          gcloud scheduler jobs update http magi-price-tracker-hourly \
            --location=${{ env.REGION }} \
            --schedule="0 * * * 1-5" \
            --time-zone="America/New_York" \
            --uri="${URL}/run" \
            --http-method=GET \
            --oidc-service-account-email="github-actions@screen-share-459802.iam.gserviceaccount.com" \
            --oidc-token-audience="${URL}/run" \
            --project=${{ env.PROJECT_ID }} || \
          gcloud scheduler jobs create http magi-price-tracker-hourly \
            --location=${{ env.REGION }} \
            --schedule="0 * * * 1-5" \
            --time-zone="America/New_York" \
            --uri="${URL}/run" \
            --http-method=GET \
            --oidc-service-account-email="github-actions@screen-share-459802.iam.gserviceaccount.com" \
            --oidc-token-audience="${URL}/run" \
            --project=${{ env.PROJECT_ID }}
